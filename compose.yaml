name: aman

x-backend: &backend
  build: ./backend
  image: aman-backend:local
  env_file: ./backend/.env
  environment:
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
  volumes:
    - backend-storage:/app/storage
  init: true

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-aman}
      MYSQL_USER: ${DB_USERNAME:-aman}
      MYSQL_PASSWORD: ${DB_PASSWORD:-aman-local-only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-aman-root-local-only}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *backend
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      mysql:
        condition: service_healthy

  app:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  reverb:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=65", "--max-time=3600"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  mysql-data:
  backend-storage:
