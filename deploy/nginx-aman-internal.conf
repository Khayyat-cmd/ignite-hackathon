# AMAN internal vhost: the loopback-only listener the CAMARA orchestration
# agent calls. In production Laravel is served by PHP-FPM behind the public
# vhost, so the agent has no :8000 to call the way it does on a developer
# machine; this gives it one that nothing off this host can reach, and only the
# tool gateway is routed here.
#
# Deliberately a separate file from nginx-aman.conf: certbot rewrites the TLS
# vhost on every provision run, and this block must stay out of its way.
server {
    listen 127.0.0.1:8127;
    server_name localhost;

    access_log /var/log/nginx/aman.internal.access.log;
    error_log  /var/log/nginx/aman.internal.error.log;

    client_max_body_size 1m;

    location = /api/internal/agent/camara {
        include fastcgi_params;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME /var/www/aman/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/aman/backend/public;
        fastcgi_read_timeout 10;
    }

    location / {
        return 404;
    }
}
