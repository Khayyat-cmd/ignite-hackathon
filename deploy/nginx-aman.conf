# AMAN demo vhost. Operator console (static) + Laravel API + responder APK.
# Copy to /etc/nginx/sites-available/aman.baraaelbaba.com and symlink into sites-enabled.
# certbot --nginx adds the TLS server block and the port 80 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name aman.baraaelbaba.com;

    root /var/www/aman/web;
    index index.html;

    access_log /var/log/nginx/aman.access.log;
    error_log  /var/log/nginx/aman.error.log;

    client_max_body_size 100m;

    # Laravel front controller. Everything under /api goes to PHP-FPM.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME /var/www/aman/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/aman/backend/public;
        fastcgi_read_timeout 60;
    }

    location = /downloads/aman-responder.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="aman-responder.apk"';
        add_header Cache-Control 'no-store';
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control 'public, immutable';
    }

    # Single-page operator console.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
